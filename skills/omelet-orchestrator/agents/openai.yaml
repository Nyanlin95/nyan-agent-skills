interface:
  display_name: "Omelet Orchestrator"
  short_description: "Operate or configure the repository's primary Omelet orchestration"
  default_prompt: "Use $omelet-orchestrator to operate or configure the primary Omelet orchestrator for this repository. Infer the work posture and intended artifact state from the user's action, subject, deliverable, quantity, and constraints. Ground every task in current task-local truth and the relevant dynamic sources for its code, product, architecture, design, security, operations, content, data, or provider decisions; scale research depth to uncertainty and consequence, record freshness for changeable claims, and require each source to affect a decision. When Omelet is selected and the user points to one visible surface for detailed refinement, seal that surface; add current shipped UI patterns, fresh visual-direction signals, and authoritative guidance; then prove the relevant states without broadening the product scope. Omelet may work directly; delegate only when a specialist or independent result materially improves the outcome. Plan in semantic orchestration patterns and reconstruct the task semantic from discovered work. For visible product design, establish intent and protected behavior, bound what references govern, and let the design specialist choose the visual means."
