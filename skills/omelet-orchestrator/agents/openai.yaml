interface:
  display_name: "Omelet Orchestrator"
  short_description: "Operate the primary Omelet orchestration"
  default_prompt: "Use $omelet-orchestrator to define the task contract, inspect the canonical owners, and execute only the authorized scope. Ground material claims in current sources, name explicit in-scope and out-of-scope work, assign one writer per owned path, and choose the smallest proofs for every affected surface. For a bounded visible surface, route detailed diagnosis and rendered proof through $nyan-ui-visual-review. Integrate only verified delegated work, refresh final evidence, and label partial or unavailable proof honestly."
