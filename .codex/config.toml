# Omelet model selection follows the host and the guidance in its skill.
# Prefer Astra for the primary orchestrator when the current host supports it.

[agents.history_analyst]
description = "Find recurring failures and strong examples in installed coding-agent logs and memories. Read-only and privacy-bounded."
config_file = "agents/history-analyst.toml"

[agents.skill_researcher]
description = "Research upstream guidance and repository evidence for one bounded skill question."
config_file = "agents/skill-researcher.toml"

[agents.skill_implementer]
description = "Default writer for creating or improving skills and their catalog entries."
config_file = "agents/skill-implementer.toml"

[agents.skill_reviewer]
description = "Independently review skill changes for ownership, triggers, safety, and evidence gaps."
config_file = "agents/skill-reviewer.toml"

[agents.skill_syncer]
description = "Validate repository skills and synchronize approved source files to installed skill roots."
config_file = "agents/skill-syncer.toml"

[agents.git_pr_manager]
description = "Publish intentional changes through ready PRs, babysit checks and reviews, and perform authorized merges."
config_file = "agents/git-pr-manager.toml"
